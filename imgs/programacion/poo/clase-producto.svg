<svg xmlns="http://www.w3.org/2000/svg" width="300" height="290" viewBox="0 0 300 290">

  <style>
    .box { fill: #1a1d27; stroke: #4f8ef7; stroke-width: 1.5; }
    .header { fill: #1a3a6b; }
    .divider { stroke: #4f8ef7; stroke-width: 1; }
    .divider-dash { stroke: #4f8ef7; stroke-width: 0.8; stroke-dasharray: 5,3; }
    .title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #82b4f7; }
    .attr { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #a6e3a1; }
    .method { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #e8eaf0; }
    .legend { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; fill: #8b90a8; }
  </style>

  <!-- Fondo -->
  <rect width="300" height="290" fill="#0f1117" rx="8"/>

  <!-- Caja principal -->
  <rect x="20" y="20" width="260" height="250" rx="4" class="box"/>

  <!-- Header -->
  <rect x="20" y="20" width="260" height="38" rx="4" class="header"/>
  <rect x="20" y="44" width="260" height="14" class="header"/>

  <!-- Nombre de la clase -->
  <text x="150" y="44" text-anchor="middle" class="title">Producto</text>

  <!-- Línea divisora atributos -->
  <line x1="20" y1="58" x2="280" y2="58" class="divider"/>

  <!-- Atributos -->
  <text x="34" y="78" class="attr">- nombre: String</text>
  <text x="34" y="98" class="attr">- precio: double</text>
  <text x="34" y="118" class="attr">- stock: int</text>

  <!-- Línea divisora métodos (punteada) -->
  <line x1="20" y1="132" x2="280" y2="132" class="divider-dash"/>

  <!-- Métodos -->
  <text x="34" y="152" class="method">+ Producto(n, p, s)</text>
  <text x="34" y="172" class="method">+ calcularDescuento(): void</text>
  <text x="34" y="192" class="method">+ actualizarStock(cant): void</text>
  <text x="34" y="212" class="method">+ getNombre(): String</text>
  <text x="34" y="232" class="method">+ getPrecio(): double</text>

  <!-- Leyenda -->
  <text x="150" y="256" text-anchor="middle" class="legend">- privado   + publico   ( ) metodo</text>

</svg>
