<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examnio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d27;--border:#2e3350;
    --accent:#4f8ef7;--accent2:#7c5cbf;--text:#e8eaf0;--text2:#8b90a8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }
  .logo {
    font-size:42px; font-weight:800; margin-bottom:8px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tagline {
    color:var(--text2); font-size:14px; margin-bottom:56px;
    letter-spacing:.3px;
  }
  .cards {
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
    width:100%; max-width:480px;
  }
  .card {
    background:var(--surface); border:2px solid var(--border);
    border-radius:14px; padding:32px 24px; text-align:center;
    text-decoration:none; color:var(--text);
    transition:all .2s; cursor:pointer;
  }
  .card:hover { transform:translateY(-3px); }
  .card.estudiante:hover { border-color:var(--accent); background:rgba(79,142,247,.07); }
  .card.profesor:hover  { border-color:var(--accent2); background:rgba(124,92,191,.07); }
  .card-icon { font-size:36px; margin-bottom:14px; display:block; }
  .card-title { font-size:16px; font-weight:700; margin-bottom:6px; }
  .card-desc  { font-size:12px; color:var(--text2); line-height:1.5; }
  .card.estudiante .card-title { color:var(--accent); }
  .card.profesor  .card-title  { color:var(--accent2); }
  .footer { margin-top:48px; font-size:11px; color:var(--text2); opacity:.6; }

  @media(max-width:480px){
    .cards { grid-template-columns:1fr; max-width:280px; }
    .logo  { font-size:32px; }
  }
</style>
</head>
<body>

  <div class="logo">Examnio</div>
  <p class="tagline">Integridad académica en el examen digital</p>

  <div class="cards">
    <a class="card estudiante" href="examen.html">
      <span class="card-icon">📝</span>
      <div class="card-title">Soy estudiante</div>
      <p class="card-desc">Presentar examen o ver mis resultados</p>
    </a>
    <a class="card profesor" href="profesor.html">
      <span class="card-icon">🎓</span>
      <div class="card-title">Soy profesor</div>
      <p class="card-desc">Panel de gestión y calificación</p>
    </a>
  </div>

  <p class="footer">© Norbey Danilo Muñoz · Examnio v0.1</p>

</body>
</html>
